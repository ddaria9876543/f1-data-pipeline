
# F1 Data Pipeline
# OpenF1 API -> Airflow/Python -> PostgreSQL -> dbt -> Metabase

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_PUBLICIST_USER}:${POSTGRES_PUBLICIST_PASSWORD}@postgres-publisher:5432/${POSTGRES_PUBLICIST_DB}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth

    POSTGRES_PUBLICIST_USER: ${POSTGRES_PUBLICIST_USER}
    POSTGRES_PUBLICIST_PASSWORD: ${POSTGRES_PUBLICIST_PASSWORD}
    POSTGRES_PUBLICIST_DB: ${POSTGRES_PUBLICIST_DB}
    POSTGRES_HOST: postgres-publisher
    DBT_PROFILES_DIR: /usr/app/profiles


  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins

    # dbt-проект и настройки подключения
    - ./dbt/f1:/usr/app/dbt
    - ./.dbt_template:/usr/app/profiles:ro

  user: "${AIRFLOW_UID:-50000}:0"

  networks:
    - data_postgres

  depends_on:
    postgres-publisher:
      condition: service_healthy

services:

  # PostgreSQL - хранение данных F1
  postgres-publisher:
    image: postgres:13

    environment:
      POSTGRES_USER: ${POSTGRES_PUBLICIST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PUBLICIST_PASSWORD}
      POSTGRES_DB: ${POSTGRES_PUBLICIST_DB}

    volumes:
      - postgres-publisher-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - data_postgres

    ports:
      - "5432:5432"

  # Airflow - инициализация
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username airflow \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email airflow@example.com \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-airflow}" || true)

    restart: on-failure

  # Airflow - веб-интерфейс
  airflow-webserver:
    <<: *airflow-common
    command: webserver

    ports:
      - "8082:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow - планировщик DAG
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # dbt - SQL-преобразования и витрины
  dbt:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /usr/app/dbt

    entrypoint: ["/bin/bash", "-c"]
    command: ["sleep infinity"]

    volumes:
      - ./dbt/f1:/usr/app/dbt
      - ./.dbt_template:/usr/app/profiles:ro

    environment:
      POSTGRES_PUBLICIST_USER: ${POSTGRES_PUBLICIST_USER}
      POSTGRES_PUBLICIST_PASSWORD: ${POSTGRES_PUBLICIST_PASSWORD}
      POSTGRES_PUBLICIST_DB: ${POSTGRES_PUBLICIST_DB}
      DBT_PROFILES_DIR: /usr/app/profiles

    networks:
      - data_postgres

    depends_on:
      postgres-publisher:
        condition: service_healthy

  # Metabase - аналитические дашборды
  metabase:
    image: metabase/metabase:v0.49.8

    ports:
      - "3001:3000"

    volumes:
      - ./metabase:/metabase-data

    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db

    networks:
      - data_postgres

    depends_on:
      postgres-publisher:
        condition: service_healthy

# Docker volumes
volumes:
  postgres-publisher-data:
  airflow-logs:
  airflow-plugins:

# Docker networks
networks:
  data_postgres:
    driver: bridge
