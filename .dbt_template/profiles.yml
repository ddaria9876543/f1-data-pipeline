
f1_marts:
  target: dev
  outputs:
    dev:
      type: postgres
      host: postgres-publisher
      port: 5432
      user: "{{ env_var('POSTGRES_PUBLICIST_USER') }}"
      password: "{{ env_var('POSTGRES_PUBLICIST_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_PUBLICIST_DB') }}"
      schema: analytics
      threads: 4
