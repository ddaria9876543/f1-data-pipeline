version: 2

models:
  - name: stg_laps
    description: "Очищенные данные о кругах"

    columns:
      - name: session_key
        data_tests:
          - not_null

      - name: driver_number
        data_tests:
          - not_null

      - name: lap_number
        data_tests:
          - not_null

      - name: lap_duration
        data_tests:
          - not_null

  - name: stg_positions
    description: "Очищенные данные о позициях пилотов"

    columns:
      - name: session_key
        data_tests:
          - not_null

      - name: driver_number
        data_tests:
          - not_null

      - name: position
        data_tests:
          - not_null

  - name: stg_pit_stops
    description: "Очищенные данные о пит-стопах"

    columns:
      - name: session_key
        data_tests:
          - not_null

      - name: driver_number
        data_tests:
          - not_null

      - name: lap_number
        data_tests:
          - not_null

      - name: pit_duration
        data_tests:
          - not_null

  - name: stg_weather
    description: "Очищенные погодные данные"

    columns:
      - name: session_key
        data_tests:
          - not_null

      - name: air_temperature
        data_tests:
          - not_null

      - name: track_temperature
        data_tests:
          - not_null

      - name: humidity
        data_tests:
          - not_null

      - name: pressure
        data_tests:
          - not_null